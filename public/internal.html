<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Internal reference: no reason for it to appear in search results. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1618">
<title>QRDrop Field Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* Light is the bare :root so a viewer with no explicit preference resolves. */
  :root {
    --ground: #F4F2ED;
    --surface: #FFFFFF;
    --sunk: #EBE8E1;
    --line: #DCD8CF;
    --hair: #E7E4DC;
    --ink: #141A1B;
    --muted: #5D6B68;
    --faint: #8B9793;
    --lamp: #9C6B12;
    --lamp-soft: rgba(156, 107, 18, 0.10);
    --signal: #2F7A54;
    --shadow: 0 1px 2px rgba(20, 26, 27, 0.06), 0 8px 28px -18px rgba(20, 26, 27, 0.28);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ground: #0F1618;
      --surface: #172124;
      --sunk: #121B1D;
      --line: #263436;
      --hair: #1F2C2E;
      --ink: #E6EBE8;
      --muted: #8DA09C;
      --faint: #6B7C79;
      --lamp: #E3A63C;
      --lamp-soft: rgba(227, 166, 60, 0.12);
      --signal: #5FA87E;
      --shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 24px 60px -30px rgba(0, 0, 0, 0.8);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1618;
    --surface: #172124;
    --sunk: #121B1D;
    --line: #263436;
    --hair: #1F2C2E;
    --ink: #E6EBE8;
    --muted: #8DA09C;
    --faint: #6B7C79;
    --lamp: #E3A63C;
    --lamp-soft: rgba(227, 166, 60, 0.12);
    --signal: #5FA87E;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 24px 60px -30px rgba(0, 0, 0, 0.8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: Karla, ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------------------- the gate */
  .gate {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
  }
  .panel {
    width: 100%;
    max-width: 430px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: var(--shadow);
    padding: 40px 34px 34px;
    text-align: center;
  }
  .lamp {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    margin: 0 auto 26px;
    background: var(--lamp);
    box-shadow: 0 0 0 5px var(--lamp-soft), 0 0 16px var(--lamp);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .lamp[data-open="true"] {
    background: var(--signal);
    box-shadow: 0 0 0 5px var(--lamp-soft), 0 0 16px var(--signal);
    animation: none;
  }
  @keyframes pulse { 50% { opacity: 0.42; } }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .panel h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: 40px;
    line-height: 1.06;
    letter-spacing: -0.01em;
    margin: 12px 0 10px;
    text-wrap: balance;
  }
  .panel p {
    color: var(--muted);
    font-size: 14.5px;
    margin: 0 0 26px;
  }
  .field { display: flex; gap: 8px; }
  input[type="password"] {
    flex: 1;
    min-width: 0;
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 15px;
    letter-spacing: 0.12em;
    padding: 12px 14px;
  }
  input[type="password"]:focus-visible,
  button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  button {
    background: var(--lamp);
    border: 1px solid var(--lamp);
    border-radius: 3px;
    color: var(--ground);
    font-family: Karla, sans-serif;
    font-size: 14.5px;
    font-weight: 700;
    padding: 12px 20px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .hint {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--hair);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    color: var(--faint);
  }
  .hint b { color: var(--lamp); font-weight: 500; }
  .wrong { color: #C4553F; font-size: 13.5px; margin: 16px 0 0; min-height: 1.2em; }
  :root:not([data-theme="light"]) { @media (prefers-color-scheme: dark) { .wrong { color: #E68A72; } } }
  :root[data-theme="dark"] .wrong { color: #E68A72; }

  /* ---------------------------------------------------------- the manual */
  .doc { display: none; max-width: 940px; margin: 0 auto; padding: 64px 24px 120px; }
  .doc[data-open="true"] { display: block; }

  .masthead { border-bottom: 1px solid var(--line); padding-bottom: 34px; margin-bottom: 44px; }
  .masthead h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(40px, 7vw, 62px);
    line-height: 1.02;
    letter-spacing: -0.015em;
    margin: 14px 0 0;
  }
  .masthead .sub { color: var(--muted); font-size: 16px; margin: 14px 0 0; max-width: 62ch; }

  section { margin: 0 0 56px; }
  h2 {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--hair);
    text-wrap: balance;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  /* The numbers are real: the manual is meant to be referenced by section. */
  .num {
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 26px;
    color: var(--lamp);
    flex: none;
    min-width: 1.6em;
  }
  h3 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 30px 0 10px;
    color: var(--ink);
  }
  p, li { max-width: 68ch; }
  p { margin: 0 0 15px; }
  ul, ol { margin: 0 0 15px; padding-left: 22px; }
  li { margin-bottom: 9px; }
  strong { font-weight: 700; }
  em { font-style: italic; }
  a { color: var(--lamp); }

  .lede { font-size: 19px; color: var(--muted); max-width: 64ch; }
  .dim { color: var(--faint); }
  .mono, code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.88em;
  }

  .steps { counter-reset: step; list-style: none; padding: 0; }
  .steps li {
    counter-increment: step;
    position: relative;
    padding-left: 42px;
    margin-bottom: 14px;
  }
  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 1px;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--lamp);
  }

  .callout {
    background: var(--lamp-soft);
    border-left: 2px solid var(--lamp);
    padding: 15px 18px;
    margin: 20px 0;
    max-width: 68ch;
    font-size: 15.5px;
  }

  .table-wrap { overflow-x: auto; margin: 0 0 22px; }
  table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 15px; }
  th {
    text-align: left;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 500;
    padding: 0 14px 9px 0;
    border-bottom: 1px solid var(--line);
  }
  td {
    padding: 12px 14px 12px 0;
    border-bottom: 1px solid var(--hair);
    vertical-align: top;
    font-variant-numeric: tabular-nums;
  }
  tr:last-child td { border-bottom: none; }
  td:first-child { color: var(--ink); }

  .doc-foot {
    border-top: 1px solid var(--line);
    padding-top: 22px;
    color: var(--faint);
    font-size: 14px;
  }
  .doc-foot p { max-width: 68ch; margin: 0; }

  @media (prefers-reduced-motion: reduce) { .lamp { animation: none; } }
  @media (max-width: 620px) {
    body { font-size: 16px; }
    .doc { padding: 40px 18px 90px; }
    h2 { gap: 11px; }
    .num { font-size: 21px; }
  }
</style>

</head>
<body>

<div class="gate" id="gate">
  <div class="panel">
    <div class="lamp" id="lamp" aria-hidden="true"></div>
    <div class="eyebrow">Internal &middot; QRDrop</div>
    <h1>Field Manual</h1>
    <p>How the whole thing works, end to end. Enter the passphrase to open the line.</p>
    <form class="field" id="form">
      <input type="password" id="pw" autocomplete="current-password"
             placeholder="passphrase" aria-label="Passphrase" autofocus>
      <button type="submit" id="go">Open</button>
    </form>
    <p class="wrong" id="msg" role="status" aria-live="polite"></p>
    <div class="hint">Hint &mdash; <b>Landline</b></div>
  </div>
</div>

<main class="doc" id="doc">
  <header class="masthead">
    <div class="eyebrow">Internal documentation</div>
    <h1>QRDrop Field Manual</h1>
    <p class="sub">Peer-to-peer file transfer in the browser. Every mechanism, the
    reasoning behind it, and the places it breaks.</p>
  </header>
  <div id="body"></div>
</main>

  const body = document.getElementById("body");
  const msg = document.getElementById("msg");
  const lamp = document.getElementById("lamp");
  const go = document.getElementById("go");

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const entered = document.getElementById("pw").value;
    if (!entered) return;
    go.disabled = true;
    msg.textContent = "";

    try {
      const base = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(entered.trim().toLowerCase()),

        false,
        ["deriveKey"],

        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"],
      );

      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: bytes(PAYLOAD.iv) },
        key,
        bytes(PAYLOAD.data),
      );
      body.innerHTML = new TextDecoder().decode(plain);
      lamp.dataset.open = "true";
      await new Promise((r) => setTimeout(r, 260));
      gate.style.display = "none";
      doc.dataset.open = "true";
      document.title = "QRDrop Field Manual";

      go.disabled = false;
      msg.textContent = "That passphrase does not open it.";
      document.getElementById("pw").select();
